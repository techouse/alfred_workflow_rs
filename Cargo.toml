[package]
authors = ["Klemen Tusar <techouse@gmail.com>"]
name = "alfred_workflow_rs"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Build Alfred workflows in Rust with Script Filter output, caches, plist user configuration, and GitHub updates."
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/techouse/alfred_workflow_rs"
homepage = "https://techouse.github.io/alfred_workflow_rs/"
documentation = "https://docs.rs/alfred_workflow_rs"
keywords = ["alfred", "workflow", "macos", "script-filter"]
categories = ["development-tools"]
publish = ["crates-io"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "examples/**",
    "src/**",
    "tests/**",
]

[dependencies]
cached = { version = "2.0.2", default-features = false, features = ["disk_store"] }
md5 = "0.8.1"
plist = "1.10.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "3.3.0"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
mockito = "1.7"
pretty_assertions = "1.4"
tempfile = "3.10"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

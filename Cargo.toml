[package]
name = "alfred_workflow_rs"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.88"
authors = ["Klemen Tusar"]
description = "Rust port of the Dart alfred_workflow helper library for Alfred workflows."
license = "BSD-3-Clause"
readme = "README.md"
documentation = "https://docs.rs/alfred_workflow_rs"
keywords = ["alfred", "workflow", "macos", "script-filter"]
categories = ["development-tools"]
exclude = [
    ".codacy.yml",
    ".github/",
    ".gitattributes",
    ".gitignore",
    ".history/",
    ".vscode/**",
    "AGENTS.md",
    "about.hbs",
    "about.toml",
    "CODE-OF-CONDUCT.md",
    "docs/",
    "fuzz/**",
    "install.sh",
    "Makefile",
    "RELEASING.md",
    "SPEC.md",
    "scripts/**",
    "src/**/tests.rs",
    "src/**/tests/**",
    "SECURITY.md",
    "tests/**",
    "THIRD-PARTY-LICENSES.md",
]

[dependencies]
cached = { version = "2.0.2", default-features = false, features = ["disk_store"] }
md5 = "0.8"
plist = "1.9.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "3.3.0"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
mockito = "1.7"
pretty_assertions = "1.4"
tempfile = "3.10"

[package]
name = "alfred_workflow_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
cached = { version = "2.0.2", default-features = false, features = ["disk_store"] }
md5 = "0.8"
plist = "1.9.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "3.3.0"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
mockito = "1.7"
pretty_assertions = "1.4"
tempfile = "3.10"
